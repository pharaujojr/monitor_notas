plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.pharaujo'
version = '0.0.1-SNAPSHOT'
description = 'Monitor de NF-e de entrada'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'br.com.swconsultoria:java-nfe:4.00.51'
	// java-nfe usa o namespace javax.xml.bind (JAXB 2.x); Java 21 não traz JAXB embutido
	// e o BOM do Spring Boot 3 gerencia o JAXB para jakarta 4.x. Trazemos o runtime javax 2.3.
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'com.sun.xml.bind:jaxb-impl:2.3.1'
	implementation 'com.sun.xml.bind:jaxb-core:2.3.0.1'
	implementation 'com.sun.activation:javax.activation:1.2.0'
	implementation 'com.github.librepdf:openpdf:1.3.39'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// java-nfe arrasta jaxb-core por mais de um caminho transitivo (mesmo nome de jar);
// mantém a primeira ocorrência ao montar o fat jar.
tasks.named('bootJar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Força o JAXB 2.3 (namespace javax) que a java-nfe exige, sobrepondo o
// gerenciamento de versões do Spring Boot (que mira jakarta 4.x).
configurations.all {
	resolutionStrategy {
		force 'javax.xml.bind:jaxb-api:2.3.1'
		force 'com.sun.xml.bind:jaxb-impl:2.3.1'
		force 'com.sun.xml.bind:jaxb-core:2.3.0.1'
	}
}

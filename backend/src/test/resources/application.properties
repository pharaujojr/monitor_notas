spring.datasource.url=jdbc:h2:mem:monitor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.storage-path=build/test-storage
app.cert-storage-path=build/test-storage/certificates
app.sefaz-ambiente=HOMOLOGACAO
app.scheduler-distribution-cron=0 */15 * * * *

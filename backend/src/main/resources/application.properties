spring.application.name=monitor-nfe-entrada
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:monitor_notas}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:monitor_notas}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:monitor_notas}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:5MB}

management.endpoints.web.exposure.include=health,info

app.storage-path=${APP_STORAGE_PATH:storage}
app.cert-storage-path=${CERT_STORAGE_PATH:storage/certificates}
app.sefaz-ambiente=${SEFAZ_AMBIENTE:HOMOLOGACAO}
app.scheduler-distribution-cron=${DISTRIBUTION_CRON:0 */15 * * * *}

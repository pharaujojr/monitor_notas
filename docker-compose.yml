services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_STORAGE_PATH: ${APP_STORAGE_PATH}
      CERT_STORAGE_PATH: ${CERT_STORAGE_PATH}
      CERT_PASSWORD: ${CERT_PASSWORD}
      SEFAZ_AMBIENTE: ${SEFAZ_AMBIENTE}
      ERP_XML_IMPORT_ENABLED: ${ERP_XML_IMPORT_ENABLED:-true}
      ERP_XML_IMPORT_PATH: ${ERP_XML_IMPORT_PATH:-/data/erp-xml}
      ERP_XML_IMPORT_CRON: ${ERP_XML_IMPORT_CRON:-0 */5 * * * *}
      SEFAZ_FALLBACK_ENABLED: ${SEFAZ_FALLBACK_ENABLED:-false}
      SEFAZ_MAX_CONSULTAS_POR_EXECUCAO: ${SEFAZ_MAX_CONSULTAS_POR_EXECUCAO:-2}
    volumes:
      - app_storage:${APP_STORAGE_PATH}
      - ${ERP_XML_HOST_PATH:-./erp-xml-inbox}:${ERP_XML_IMPORT_PATH:-/data/erp-xml}:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
  app_storage:
